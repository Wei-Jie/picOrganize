name: 部署 GitHub Pages 線上網頁版

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包 mobile_app 靜態網頁目錄
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./mobile_app"

      - name: 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
